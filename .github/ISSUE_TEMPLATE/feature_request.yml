name: Feature request
description: Sugira uma melhoria ou funcionalidade
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Que dor ou limitação você quer resolver?
    validations:
      required: true
  - type: textarea
    id: solucao
    attributes:
      label: Solução proposta
      description: Como você imagina o comportamento ideal?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
