name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_version.py
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: node desktop/scripts/build-sidecar.mjs
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python scripts/build_pypi.py
      - run: python -m build --wheel
      - run: python -m twine check dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel
          path: dist/*.whl
      - name: Smoke test do wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/*.whl
          .venv/bin/gitcontrol --version
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" config user.email test@test.com
          git -C "$tmp" config user.name Test
          .venv/bin/gitcontrol --json --repo "$tmp" status

  pypi-macos:
    runs-on: macos-latest
    needs: [pypi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: pypi-wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test do wheel no macOS
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/*.whl
          .venv/bin/gitcontrol --version
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" config user.email test@test.com
          git -C "$tmp" config user.name Test
          .venv/bin/gitcontrol --json --repo "$tmp" status
