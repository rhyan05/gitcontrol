name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  go-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/gitcontrol_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" \
            ./cmd/gitcontrol
      - uses: actions/upload-artifact@v4
        with:
          name: gitcontrol-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri -- build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  pypi:
    runs-on: ubuntu-latest
    needs: [go-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: VERSION="${GITHUB_REF_NAME#v}" python scripts/build_pypi.py
      - run: python -m build --wheel
      - run: python -m twine check dist/*.whl
      - id: pypi_exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://pypi.org/pypi/gitcontrol/${VERSION}/json" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi_exists.outputs.exists == 'false'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  release:
    runs-on: ubuntu-latest
    needs: [go-binaries, desktop-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
